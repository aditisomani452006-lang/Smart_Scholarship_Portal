{% extends 'scholarships/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h3 class="fw-bold mb-1">Student Registration</h3>
            <p class="text-muted small mb-4">Enter accurate academic and income details for automated eligibility matching.</p>
            <form method="POST" id="regForm">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" minlength="6" required>
                    </div>
                    <hr class="my-2">
                    <div class="col-md-4">
                        <label class="form-label">PRN / Roll Number</label>
                        <input type="text" name="prn_number" class="form-control" placeholder="e.g., 26440" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Course / Department</label>
                        <input type="text" name="course" class="form-control" value="B.C.A" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Current Year</label>
                        <select name="current_year" class="form-select">
                            <option>First Year</option>
                            <option>Second Year</option>
                            <option selected>Third Year</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Previous %</label>
                        <input type="number" step="0.01" max="100" min="0" name="percentage" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Annual Income (&#8377;)</label>
                        <input type="number" name="annual_income" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="OPEN">OPEN</option>
                            <option value="OBC">OBC</option>
                            <option value="SC">SC</option>
                            <option value="ST">ST</option>
                            <option value="EWS">EWS</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control" placeholder="10-digit number" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4 w-100 fw-semibold">Create Student Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
